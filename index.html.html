const shuf = arr => { const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
SIGNS.forEach(s=>{ const right = s.o[s.a]; s.o = shuf(s.o); s.a = s.o.indexOf(right); });
CLOZE.forEach(ex=>ex.gaps.forEach(g=>{ const right = g.o[g.a]; g.o = shuf(g.o); g.a = g.o.indexOf(right); }));
SENT.forEach(ex=>{
  const L = "ABCDEFGH";
  const perm = shuf([0,1,2,3,4,5,6,7]);
  const oldToNew = {};
  perm.forEach((oldIdx,newIdx)=>{ oldToNew[L[oldIdx]] = L[newIdx]; });
  ex.sents = perm.map(k=>ex.sents[k]);
  ex.ans = ex.ans.map(l=>oldToNew[l]);
});
[ACT1, ACT2, ACT3, ACT4, ACT5].forEach(A=>{
  const L = "ABCDEFGH";
  const order = shuf(A.texts);
  const oldToNew = {};
  order.forEach((x,newIdx)=>{ oldToNew[x.l] = L[newIdx]; x.l = L[newIdx]; });
  A.texts = order;
  A.ans = A.ans.map(l=>oldToNew[l]);
});

// Mezcla las opciones de cada pregunta: la respuesta correcta cambia de posición
STAGES.forEach(s=>s.q.forEach(q=>{
  const correct = q.o[q.a];
  const o = [...q.o];
  for(let i=o.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [o[i],o[j]]=[o[j],o[i]]; }
  q.o = o;
  q.a = o.indexOf(correct);
}));

const keyOf = q => q.lt ? "G:" + q.g : q.q + "|" + [...q.o].sort().join(",");

function stageLabel(i){
  if(i===12) return "Examen 1";
  if(i===18) return "Examen 2";
  if(i>=19) return STAGES[i].t;
  return "Etapa " + (i<12 ? i+1 : i);
}

function pickFinal(i){
  const hk = i===18 ? "usedFinal2" : "usedFinal";
  const pool = STAGES[i].q;
  const used = new Set(state[hk] || []);
  const free = k => !used.has(keyOf(pool[k]));
  const idx = pred => pool.map((x,k)=>pred(x)?k:-1).filter(k=>k>=0);
  let rd = idx(x=>x.rd && !x.lt).filter(free);
  let gr = idx(x=>!x.rd).filter(free);
  let groups = [...new Set(idx(x=>x.lt).map(k=>pool[k].g))];
  let freeG = groups.filter(g=>!used.has("G:"+g));
  const resetKeys = new Set();
  if(rd.length<2){
    idx(x=>x.rd && !x.lt).forEach(k=>resetKeys.add(keyOf(pool[k])));
    rd = idx(x=>x.rd && !x.lt);
  }
  if(gr.length<10){
    idx(x=>!x.rd).forEach(k=>resetKeys.add(keyOf(pool[k])));
    gr = idx(x=>!x.rd);
  }
  if(freeG.length<2){
    groups.forEach(g=>resetKeys.add("G:"+g));
    freeG = groups;
  }
  if(resetKeys.size) state[hk] = (state[hk] || []).filter(k=>!resetKeys.has(k));
  const pickG = randomSubset(freeG.length,2).map(k=>freeG[k]);
  const c = idx(x=>x.lt && pickG.includes(x.g));
  const b = randomSubset(gr.length,10).map(k=>gr[k]);
  const a = randomSubset(rd.length,2).map(k=>rd[k]);
  return [...b, ...a, ...c];
}

function pct(a){ return a[1] ? Math.round(a[0]/a[1]*100)+"% ("+a[0]+"/"+a[1]+")" : "sin datos"; }

function moodScale(){
  const ok = state.skills.gram[0] + state.skills.read[0];
  const t = state.skills.gram[1] + state.skills.read[1];
  const p = t ? ok/t : -1;
  const k = p<0 ? -1 : p<0.2 ? 0 : p<0.4 ? 1 : p<0.6 ? 2 : p<0.8 ? 3 : 4;
  const faces = ["😢","😕","😐","🙂","😄"];
  return `<span class="scale">${faces.map((f,i)=>`<span class="face${i===k?" on":""}">${f}</span>`).join("")}</span>`;
}

function levelPanel(){
  const s = state.skills;
  return `<section class="panel"><h3>📊 Tu nivel por habilidad ${moodScale()}</h3>
    <ul class="skills">
      <li>Gramática: <b>${pct(s.gram)}</b></li>
      <li>Comprensión lectora: <b>${pct(s.read)}</b></li>
    </ul>
  </section>`;
}

function finishFinal(i){
  const n = view.n, c = view.correct, r = view.rd, score = view.score;
  const overall = c/n, readOk = r[1] ? r[0]/r[1] : 0;
  const b1 = overall>=0.75 && readOk>=0.75;
  const bonus = b1 ? 50 : 0;
  const rk = i===18 ? "finalResult2" : "finalResult";
  state[rk] = {score:c, n:n, read:[r[0],r[1]], b1:b1, date:Date.now()};
  if(b1){
    state.stars[i] = Math.max(state.stars[i] || 0, c===n ? 3 : 2);
    if(i===state.unlocked && i+1<STAGES.length) state.unlocked = i+1;
  }
  const hk2 = i===18 ? "usedFinal2" : "usedFinal";
  state[hk2] = [...(state[hk2] || []), ...view.qs.map(k=>keyOf(STAGES[i].q[k]))];
  state.points += score + bonus;
  view = {stage:null};
  save();
  renderHeader();
  const canNext = b1 && i+1<STAGES.length;
  app.innerHTML = `<section class="result">
    <div class="big">${b1 ? "🏆" : "📘"} ${faceFor(c, n)}</div>
    <h2>${b1 ? "¡Nivel B1 estimado!" : "Todavía no alcanzas B1"}</h2>
    <p>Aciertos: ${c}/${n} · Lectura: ${r[0]}/${r[1]}</p>
    <p class="msg">${pickMsg(c/n)}</p>
    <p>Puntos: ${score}${bonus ? ` + recompensa de ${bonus}` : ""}</p>
    <p class="muted">${b1 ? "Superaste 75% en general y 75% en lectura." : "Necesitas al menos 75% en general y 75% en lectura. Repasa las etapas donde fallaste más."}</p>
    <p class="muted">Esta estimación cubre gramática y lectura. La comprensión auditiva, la escritura y la expresión oral aún no se miden.</p>
    <div class="actions" style="justify-content:center">
      <button class="ghost" id="map">Mapa</button>
      <button class="${canNext ? "ghost" : "primary"}" id="retry">Repetir examen</button>
      ${canNext ? `<button class="primary" id="nextStage">Siguiente etapa →</button>` : ""}
    </div>
  </section>`;
  $("#map").onclick = showMap;
  $("#retry").onclick = ()=>startStage(i);
  if(canNext) $("#nextStage").onclick = ()=>startStage(i+1);
}

function pickRun(i){
  if(i===12||i===18) return pickFinal(i);
  const pool = STAGES[i].q;
  const rds = pool.map((x,k)=>x.rd?k:-1).filter(k=>k>=0);
  const prev = (state.lastRd||{})[i];
  let cand = rds.filter(k=>k!==prev);
  if(!cand.length) cand = rds;
  const rdI = cand[Math.floor(Math.random()*cand.length)];
  state.lastRd = {...(state.lastRd||{}), [i]: rdI};
  const others = pool.map((_,k)=>k).filter(k=>!pool[k].rd);
  const pick = randomSubset(others.length, N-1).map(k=>others[k]);
  return [...pick, rdI];
}

const KEY = "englishQuestB1_v1";
const $ = s => document.querySelector(s);
const app = $("#app");
let state = load();
let view = {stage:null};

function fresh(){ return {unlocked:0, stars:Array(STAGES.length).fill(0), points:0, session:null, skills:{gram:[0,0],read:[0,0]}, finalResult:null, lang:"es", v:2}; }
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && Array.isArray(s.stars) && s.stars.length>=10){
      if(!s.v){ s.stars = [...s.stars.slice(0,9),0,0,...s.stars.slice(9)]; if(s.unlocked>9) s.unlocked += 2; s.session = null; s.v = 2; }
      if(s.session && (!s.session.qs || !s.session.n)) s.session = null; // formato anterior
      if(!s.skills) s.skills = {gram:[0,0],read:[0,0]};
      while(s.stars.length<STAGES.length) s.stars.push(0);
      if(s.finalResult === undefined) s.finalResult = null;
      if(!s.lang) s.lang = "es";
      if(s.stars[11]>0 && s.unlocked<12) s.unlocked = 12; // examen 1 desbloqueado
      if(s.stars[21]>0 && s.unlocked<22) s.unlocked = 22; // etapa extra 4 desbloqueada
      if(s.stars[22]>0 && s.unlocked<23) s.unlocked = 23; // etapa extra 5 desbloqueada
      delete s.dev;
      return s;
    }
  }catch(e){}
  return fresh();
}
function save(){
  state.session = (view.stage!==null && view.stage!==undefined && !view.act && !view.cloze) ? view : null;
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
}
function randomSubset(total, n){
  const a = [...Array(total).keys()];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a.slice(0,n);
}

function renderHeader(){
  const done = state.stars.filter(s=>s>0).length;
  const total = STAGES.length;
  $("#bar").style.width = (done/total*100)+"%";
  $("#pts").textContent = state.points;

  $("#prog").textContent = done+"/"+total+" etapas completadas";
  const b = state.stars.map((s,i)=> s && STAGES[i] ? `<span class="badge" title="${STAGES[i].t}">${s===3?"💎":"🏅"}</span>` : "").join("");
  $("#badges").innerHTML = b || "Sin insignias todavía";
}

function showMap(){
  view = {stage:null};
  renderHeader();
  const resume = state.session ? `<button class="primary" id="resume">▶ Continuar ${stageLabel(state.session.stage)}</button>` : "";
  app.innerHTML = `<div class="map-top"><div><h2>Mapa de etapas</h2>
    <p class="muted">Cada intento tiene ${N} preguntas: una lectura obligatoria y el resto al azar (afirmativas, negativas y preguntas). Necesitas ${PASS} aciertos para avanzar.</p></div>${resume}</div>
    ${levelPanel()}<div class="grid">` + STAGES.map((st,i)=>{
      const locked = i>state.unlocked;
      const s = state.stars[i];
      return `<button class="stage ${locked?"locked":""}" ${locked?"disabled":""} data-i="${i}">
        <span class="num">${i>=19?"":stageLabel(i)}</span>
        <span>${locked?"🔒 ":""}${st.t}</span>
        <span class="st">${s ? "★".repeat(s)+"☆".repeat(3-s) : (locked?"Bloqueada":"Disponible")}</span>
      </button>`;
    }).join("") + `</div>`;
  app.querySelectorAll(".stage:not(.locked)").forEach(b=>b.onclick=()=>startStage(+b.dataset.i));
  const r = $("#resume");
  if(r) r.onclick = ()=>{ view = state.session; showQ(); };
}

function startStage(i){
  if(STAGES[i].acts) return showAct(i);
  if(STAGES[i].cloze) return showCloze(i, Math.floor(Math.random()*STAGES[i].cloze.length), 0);
  if(STAGES[i].sent) return showSent(i, Math.floor(Math.random()*STAGES[i].sent.length), 0);
  if(STAGES[i].signs) return showSigns(i);
  if(STAGES[i].open) return showOpen(i, Math.floor(Math.random()*STAGES[i].open.length));
  view = {stage:i, n:((i===12||i===18)?20:N), qi:0, qs:pickRun(i), rd:[0,0], correct:0, hints:0, score:0, answered:false, lastK:null, lastVal:null, hinted:[]};
  save();
  showQ();
}

function curQ(){ return STAGES[view.stage].q[view.qs[view.qi]]; }

function showAct(i){
  const pool = STAGES[i].acts || [STAGES[i].act];
  const A = pool[Math.floor(Math.random()*pool.length)];
  const L = "ABCDEFGH";
  view = {stage:i, act:true, cur:A, sel:Array(A.people.length).fill(null)};
  app.innerHTML = `<section class="quiz">
    <div class="top"><button class="ghost sm" id="exit">← Mapa</button><span class="muted">${STAGES[i].t}</span></div>
    <div class="tipbox"><b>Exam tip</b><ul>${A.tips.map(t=>`<li>${t}</li>`).join("")}</ul></div>
    <p class="q small">${A.task}</p>
    <div class="texts">${A.texts.map(x=>`<p><b>${x.l}</b> ${x.t}</p>`).join("")}</div>
    <div class="people">${A.people.map((p,k)=>`<div class="row2"><span>${k+1}. ${p}</span><select data-k="${k}"><option value="">—</option>${L.split("").map(c=>`<option>${c}</option>`).join("")}</select></div>`).join("")}</div>
    <div id="fb" class="fb"></div>
    <div class="actions"><button class="primary" id="check">Revisar respuestas</button></div>
  </section>`;
  $("#exit").onclick = showMap;
  app.querySelectorAll("select").forEach(s=>s.onchange=()=>{ view.sel[+s.dataset.k] = s.value || null; });
  $("#check").onclick = ()=>actCheck(i);
}

function actCheck(i){
  const A = view.cur;
  let ok = 0;
  A.people.forEach((p,k)=>{
    const good = view.sel[k] === A.ans[k];
    if(good) ok++;
    const s = app.querySelector(`select[data-k="${k}"]`);
    s.disabled = true;
    s.style.borderColor = good ? "#16a34a" : "#dc2626";
    if(!good) s.insertAdjacentHTML("afterend", `<span class="muted">Respuesta: ${A.ans[k]}</span>`);
  });
  const pass = ok>=3;
  state.act = state.act || {};
  state.act[i] = Math.max(state.act[i] || 0, ok);
  if(pass){
    state.stars[i] = Math.max(state.stars[i] || 0, ok===A.people.length ? 3 : 2);
    if(i===state.unlocked && i+1<STAGES.length) state.unlocked = i+1;
    state.points += ok*10;
  }
  view = {stage:null};
  save();
  renderHeader();
  $("#check").hidden = true;
  $("#fb").innerHTML = `<p class="${pass ? "ok" : "bad"}">Correctas: ${ok}/${A.people.length}</p>${pass ? "" : `<p class="muted">Necesitas al menos 3 aciertos para avanzar.</p>`}<p class="msg">${pickMsg(ok/A.people.length)}</p>`;
  const canNext = pass && i+1<STAGES.length;
  const bar = app.querySelector(".actions");
  bar.innerHTML = `<button class="ghost" id="map">Mapa</button><button class="${canNext ? "ghost" : "primary"}" id="again">Reintentar</button>${canNext ? `<button class="primary" id="nextStage">Siguiente etapa →</button>` : ""}`;
  $("#map").onclick = showMap;
  $("#again").onclick = ()=>showAct(i);
  if(canNext) $("#nextStage").onclick = ()=>startStage(i+1);
}

function showCloze(i, k, sum){
  const ex = STAGES[i].cloze[k];
  view = {stage:i, cloze:true, ex:k, sum:sum};
  const txt = ex.text.replace(/\{(\d)\}/g, (m,n)=>`<select data-g="${n-1}" class="gap"><option value="">—</option>${ex.gaps[n-1].o.map(o=>`<option>${o}</option>`).join("")}</select>`);
  app.innerHTML = `<section class="quiz">
    <div class="top"><button class="ghost sm" id="exit">← Mapa</button><span class="muted">${STAGES[i].t}</span></div>
    <div class="tipbox"><b>Exam tip</b><ul><li>Read the whole of each gapped sentence. Look at the words that come immediately before and after the missing word to make sure the word you choose fits into the sentence.</li></ul></div>
    <h2>${ex.title}</h2>
    <p class="q small">${txt}</p>
    <div id="fb" class="fb"></div>
    <div class="actions"><button class="primary" id="check">Revisar respuestas</button></div>
  </section>`;
  $("#exit").onclick = showMap;
  $("#check").onclick = ()=>clozeCheck(i, k);
}

function clozeCheck(i, k){
  const ex = STAGES[i].cloze[k];
  let ok = 0;
  app.querySelectorAll("select.gap").forEach(s=>{
    const g = +s.dataset.g;
    const right = ex.gaps[g].o[ex.gaps[g].a];
    const good = s.value === right;
    if(good) ok++;
    s.disabled = true;
    s.style.borderColor = good ? "#16a34a" : "#dc2626";
    if(!good) s.insertAdjacentHTML("afterend", `<span class="muted"> ${right}</span>`);
  });
  const total = view.sum + ok;
  const pass = total>=4;
  $("#check").hidden = true;
  if(pass){
    state.points += total*3;
    state.stars[i] = Math.max(state.stars[i] || 0, total===6 ? 3 : 2);
    if(i===state.unlocked && i+1<STAGES.length) state.unlocked = i+1;
  }
  view = {stage:null};
  save();
  renderHeader();
  $("#fb").innerHTML = `<p class="${pass ? "ok" : "bad"}">Correctas: ${ok}/6</p>${pass ? "" : `<p class="muted">Necesitas al menos 4 aciertos para avanzar.</p>`}<p class="msg">${pickMsg(total/6)}</p>`;

  return `<svg class="laurel ${cls}" viewBox="0 0 60 150" aria-hidden="true"><path d="M48 140 Q8 95 30 8" fill="none" stroke="#b45309" stroke-width="2.5"/><g fill="#16a34a">${leaves}</g></svg>`;

  app.innerHTML = `<section class="quiz">
    <div class="top">
      <button class="ghost sm" id="exit">← Mapa</button>

  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  $("#hint").onclick = hint;
  $("#next").onclick = next;

  if(view.hinted.includes(view.qi)) showHint();
  if(view.answered) reveal();
  else $("#hint").disabled = view.hinted.includes(view.qi);

function showHint(){
  $("#fb").innerHTML = `<p class="hint">💡 ${curQ().h}</p>`;
}

function hint(){
  if(view.answered || view.hinted.includes(view.qi)) return;
  view.hinted.push(view.qi);
  view.hints++;
  view.score = Math.max(0, view.score-3);
  $("#sc").textContent = view.score+" pts";
  showHint();
  $("#hint").disabled = true;
  save();
}

function answer(k){
  if(view.answered) return;
  view.answered = true;
  view.lastK = k;
  view.lastVal = curQ().o[k];
  const isRd = !!curQ().rd, ok = k===curQ().a, sk = isRd ? "read" : "gram";
  if(!state.skills) state.skills = {gram:[0,0],read:[0,0]};
  state.skills[sk][1]++; if(ok) state.skills[sk][0]++;
  view.rd = view.rd || [0,0];
  if(isRd){ view.rd[1]++; if(ok) view.rd[0]++; }
  if(ok){ view.correct++; view.score += 10; }
  reveal();
  save();
}

function reveal(){
  const q = curQ();
  const k = (view.lastVal!==undefined && view.lastVal!==null) ? q.o.indexOf(view.lastVal) : view.lastK;
  const ok = k===q.a;
  app.querySelectorAll(".opt").forEach((b,j)=>{
    b.disabled = true;
    if(j===q.a) b.classList.add("right");
    else if(j===k) b.classList.add("wrong");
  });
  $("#fb").innerHTML = `<p class="${ok?"ok":"bad"}">${ok ? "¡Correcto! +10 pts" : "Incorrecto. La respuesta es “"+q.o[q.a]+"”."}</p>`;
  $("#hint").disabled = true;
  const nx = $("#next");
  nx.hidden = false;
  nx.textContent = view.qi<view.n-1 ? "Siguiente →" : "Ver resultado";
  $("#sc").textContent = view.score+" pts";
}

function next(){
  if(view.qi<view.n-1){
    view.qi++;
    view.answered = false;
    view.lastK = null;
    view.lastVal = null;
    save();
    showQ();
  } else {
    finish();
  }
}

function pickMsg(p){
  const pct = p*100;
  const lvl = pct<=30 ? 0 : pct<=45 ? 1 : pct<=60 ? 2 : pct<=80 ? 3 : pct<100 ? 4 : 5;
  const pool = MSG_POOL[lvl];
  state.msgUsed = state.msgUsed || {};
  let used = state.msgUsed[lvl] || [];
  let avail = pool.map((_,k)=>k).filter(k=>!used.includes(k));
  if(!avail.length){ used = []; avail = pool.map((_,k)=>k); }
  const k = avail[Math.floor(Math.random()*avail.length)];
  state.msgUsed[lvl] = [...used, k];
  return pool[k];
}

function faceFor(c, n){
  const p = n ? c/n : 0;
  const faces = ["😢","😕","😐","🙂","😄"];
  return faces[p<0.2 ? 0 : p<0.4 ? 1 : p<0.6 ? 2 : p<0.8 ? 3 : 4];
}

function finish(){
  if(view.stage===12||view.stage===18) return finishFinal(view.stage);
  const i = view.stage;
  const correct = view.correct, hints = view.hints, score = view.score, n = view.n;
  const pass = correct>=PASS;
  const stars = pass ? (correct===n && hints===0 ? 3 : 2) : 0;
  const prev = state.stars[i] || 0;
  const bonus = stars>prev ? stars*10 : 0;
  state.points += score + bonus;
  state.stars[i] = Math.max(prev, stars);
  if(pass && i===state.unlocked && i+1<STAGES.length) state.unlocked = i+1;
  view = {stage:null};
  save();
  renderHeader();

  const unlocksExam = pass && (i===11 || i===17);
  const hasNext = pass && (i<11 || (i>=13 && i<17));
  const nextBtn = hasNext
    ? `<button class="primary" id="again">Siguiente etapa →</button>`
    : `<button class="primary" id="again">${unlocksExam ? "Ir al examen final" : "Reintentar"}</button>`;
  app.innerHTML = `<section class="result">
    <div class="big">${pass ? "🎉" : "💪"} ${faceFor(correct, n)}</div>
    <h2>${unlocksExam ? "¡Examen final desbloqueado!" : pass ? "¡Etapa superada!" : "Casi lo logras"}</h2>
    <p>Aciertos: ${correct}/${n} · Pistas usadas: ${hints}</p>
    <p>Puntos ganados: ${score}${bonus ? ` + recompensa de ${bonus}` : ""}</p>
    <p class="msg">${pickMsg(correct/n)}</p>
    <p class="stars">${stars ? "★".repeat(stars)+"☆".repeat(3-stars) : `Necesitas ${PASS} aciertos para avanzar`}</p>
    <p class="muted">${stars===3 ? "¡Perfecto sin pistas! Ganaste la insignia 💎." : pass ? "Insignia 🏅 desbloqueada." : ""}</p>
    <div class="actions" style="justify-content:center">
      <button class="ghost" id="map">Mapa</button>
      ${nextBtn}
    </div>
  </section>`;
  $("#map").onclick = showMap;
  $("#again").onclick = ()=>{
    if(hasNext || unlocksExam) startStage(i+1);
    else startStage(i);
  };
}

"Necesitas al menos 75% en general y 75% en lectura. Repasa las etapas donde fallaste más.":"You need at least 75% overall and 75% in reading. Review the stages where you missed the most.",
"Esta estimación cubre gramática y lectura. La comprensión auditiva, la escritura y la expresión oral aún no se miden.":"This estimate covers grammar and reading. Listening, writing and speaking are not measured yet.",
"Repetir examen":"Repeat exam",
"Todos los derechos reservados.":"All rights reserved."
};
const ES_KEYS = Object.keys(EN).sort((a,b)=>b.length-a.length);
const NO_TR = ".hint, .passage, .opts, .texts, .sents, .tipbox, .q, .notice-box, .sign-opts, .open-doc, .open-ex-note, select, input, #lang";
function toEN(s){ for(const k of ES_KEYS) s = s.split(k).join(EN[k]); return s; }
function trNode(n){
  if(n.nodeType===1 && n.matches && n.matches(NO_TR)) return;
  if(n.nodeType===3){
    if(n.parentElement && n.parentElement.closest(NO_TR)) return;
    if(n.__es===undefined) n.__es = n.nodeValue;
    const v = state.lang==="en" ? toEN(n.__es) : n.__es;
    if(n.nodeValue!==v) n.nodeValue = v;
    return;
  }
  if(n.childNodes) n.childNodes.forEach(trNode);
}
function applyLang(){
  $("#lang").textContent = state.lang==="en" ? "🌐 English" : "🌐 Español";
  trNode(document.body);
}
$("#lang").onclick = ()=>{ state.lang = state.lang==="en" ? "es" : "en"; save(); applyLang(); };
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(trNode))).observe(document.body,{childList:true,subtree:true});
renderHeader();
showMap();
applyLang();
</script>
