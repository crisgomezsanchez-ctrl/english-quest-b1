<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>English Quest B1</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1d2433;--muted:#6b7280;--accent:#4f46e5;--ok:#16a34a;--bad:#dc2626;--gold:#f59e0b;--line:#e5e7eb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1320;--card:#1a2030;--text:#e8ecf5;--muted:#9aa3b5;--accent:#818cf8;--line:#2a3143}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
h2{margin:6px 0 10px}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;max-width:1000px;margin:0 auto}
.stats{display:flex;align-items:center;gap:12px}
.barwrap{height:10px;background:var(--line);border-radius:99px;margin:10px auto;max-width:1000px;overflow:hidden}
#bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .4s}
main{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
.map-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:12px}
.stage{display:flex;flex-direction:column;gap:6px;text-align:left;min-height:96px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);font:inherit;cursor:pointer}
.stage:hover:not(:disabled){border-color:var(--accent)}
.stage.locked{opacity:.5;cursor:not-allowed}
.stage .num{font-weight:700;color:var(--accent)}
.stage .st{color:var(--gold);letter-spacing:2px}
.quiz{max-width:720px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.tag{display:inline-block;font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--line);color:var(--muted)}
.q{font-size:1.3rem;font-weight:600;margin:10px 0 0}
.opts{display:grid;gap:10px;grid-template-columns:1fr;margin-top:14px}
@media (min-width:640px){.opts{grid-template-columns:1fr 1fr}}
.opt{min-height:52px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:1.05rem;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:rgba(22,163,74,.15)}
.opt.wrong{border-color:var(--bad);background:rgba(220,38,38,.15)}
.fb{min-height:48px;margin-top:14px}
.ok{color:var(--ok);font-weight:600}
.bad{color:var(--bad);font-weight:600}
.hint{color:var(--muted);font-style:italic}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bar2{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 16px}
.bar2 i{display:block;height:100%;background:var(--accent);transition:width .3s}
.primary{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 18px;min-height:44px;font:inherit;cursor:pointer}
.ghost{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:44px;font:inherit;cursor:pointer}
.ghost:disabled{opacity:.4;cursor:not-allowed}
.sm{min-height:36px;padding:6px 10px}
.muted{color:var(--muted);font-size:.9rem}
.result{text-align:center;max-width:520px;margin:30px auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px}
.big{font-size:3rem}
.stars{font-size:1.6rem;color:var(--gold)}
.badge{font-size:1.3rem}
.passage{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0 0;font-size:1.02rem;line-height:1.6}
</style>
</head>

<main id="app"></main>

{t:"R",rd:true,r:"The new library was opened in March. Thousands of books are borrowed every month, and a café is run by volunteers. The rooms have been painted recently, and a new computer lab will be built next year. Visitors are asked to keep their voices low.",q:"What will be built next year?",o:["A café","A computer lab","A new library"],a:1,h:"Busca la frase con will be built."},

];
STAGES.forEach((s,i)=>{ s.q.push(READ[i]); });

function pickRun(i){
  const pool = STAGES[i].q;
  const rdI = pool.findIndex(x=>x.rd);
  const others = pool.map((_,k)=>k).filter(k=>k!==rdI);
  const pick = randomSubset(others.length, N-1).map(k=>others[k]);
  return [...pick, rdI];
}

const KEY = "englishQuestB1_v1";
const $ = s => document.querySelector(s);
const app = $("#app");
let state = load();
let view = {stage:null};

function fresh(){ return {unlocked:0, stars:Array(10).fill(0), points:0, session:null}; }
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && Array.isArray(s.stars) && s.stars.length===10){
      if(s.session && (!s.session.qs || !s.session.n)) s.session = null; // formato anterior
      return s;
    }
  }catch(e){}
  return fresh();
}
function save(){
  state.session = (view.stage!==null && view.stage!==undefined) ? view : null;
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
}
function pickQuestions(n){
  const idx = STAGES[0].q.map((_,i)=>i);
  return idx; // se reemplaza por etapa en startStage
}
function randomSubset(total, n){
  const a = [...Array(total).keys()];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a.slice(0,n);
}

function renderHeader(){
  const done = state.stars.filter(s=>s>0).length;
  $("#bar").style.width = (done*10)+"%";
  $("#pts").textContent = state.points;
  $("#prog").textContent = done+"/10 etapas completadas";
  const b = state.stars.map((s,i)=> s ? `<span class="badge" title="${STAGES[i].t}">${s===3?"💎":"🏅"}</span>` : "").join("");
  $("#badges").innerHTML = b || "Sin insignias todavía";
}

function showMap(){
  view = {stage:null};
  renderHeader();
  const resume = state.session ? `<button class="primary" id="resume">▶ Continuar etapa ${state.session.stage+1}</button>` : "";
  app.innerHTML = `<div class="map-top"><div><h2>Mapa de etapas</h2>
    <p class="muted">Cada intento tiene ${N} preguntas: una lectura obligatoria y el resto al azar (afirmativas, negativas y preguntas). Necesitas ${PASS} aciertos para avanzar.</p></div>${resume}</div>
    <div class="grid">` + STAGES.map((st,i)=>{
      const locked = i>state.unlocked;
      const s = state.stars[i];
      return `<button class="stage ${locked?"locked":""}" ${locked?"disabled":""} data-i="${i}">
        <span class="num">Etapa ${i+1}</span>
        <span>${locked?"🔒 ":""}${st.t}</span>
        <span class="st">${s ? "★".repeat(s)+"☆".repeat(3-s) : (locked?"Bloqueada":"Disponible")}</span>
      </button>`;
    }).join("") + `</div>`;
  app.querySelectorAll(".stage:not(.locked)").forEach(b=>b.onclick=()=>startStage(+b.dataset.i));
  const r = $("#resume");
  if(r) r.onclick = ()=>{ view = state.session; showQ(); };
}

function startStage(i){
  view = {stage:i, n:Math.min(N,STAGES[i].q.length), qi:0, qs:pickRun(i), correct:0, hints:0, score:0, answered:false, lastK:null, hinted:[]};
  save();
  showQ();
}

function curQ(){ return STAGES[view.stage].q[view.qs[view.qi]]; }

function showQ(){
  const st = STAGES[view.stage], q = curQ();
  app.innerHTML = `<section class="quiz">
    <div class="top">
      <button class="ghost sm" id="exit">← Mapa</button>
      <span class="muted">Etapa ${view.stage+1} · Pregunta ${view.qi+1}/${view.n} · <b id="sc">${view.score} pts</b></span>
    </div>
    <h2>${st.t}</h2>
    <div class="bar2"><i style="width:${view.qi/view.n*100}%"></i></div>
    <span class="tag">${TYPE[q.t]}</span>
    ${q.r ? `<div class="passage">${q.r}</div>` : ""}
    <p class="q">${q.q}</p>
    <div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join("")}</div>
    <div id="fb" class="fb"></div>
    <div class="actions">
      <button class="ghost" id="hint">💡 Pista (−3 pts)</button>
      <button class="primary" id="next" hidden>Siguiente →</button>
    </div>
  </section>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  $("#hint").onclick = hint;
  $("#next").onclick = next;
  $("#exit").onclick = showMap;
  if(view.hinted.includes(view.qi)) showHint();
  if(view.answered) reveal();
  else $("#hint").disabled = view.hinted.includes(view.qi);
}

function showHint(){
  $("#fb").innerHTML = `<p class="hint">💡 ${curQ().h}</p>`;
}

function hint(){
  if(view.answered || view.hinted.includes(view.qi)) return;
  view.hinted.push(view.qi);
  view.hints++;
  view.score = Math.max(0, view.score-3);
  showHint();
  $("#hint").disabled = true;
  save();
}

function answer(k){
  if(view.answered) return;
  view.answered = true;
  view.lastK = k;
  if(k===curQ().a){ view.correct++; view.score += 10; }
  reveal();
  save();
}

function reveal(){
  const q = curQ(), k = view.lastK, ok = k===q.a;
  app.querySelectorAll(".opt").forEach((b,j)=>{
    b.disabled = true;
    if(j===q.a) b.classList.add("right");
    else if(j===k) b.classList.add("wrong");
  });
  $("#fb").innerHTML = `<p class="${ok?"ok":"bad"}">${ok ? "¡Correcto! +10 pts" : "Incorrecto. La respuesta es “"+q.o[q.a]+"”."}</p>`;
  $("#hint").disabled = true;
  const nx = $("#next");
  nx.hidden = false;
  nx.textContent = view.qi<view.n-1 ? "Siguiente →" : "Ver resultado";
  $("#sc").textContent = view.score+" pts";
}

function next(){
  if(view.qi<view.n-1){
    view.qi++;
    view.answered = false;
    view.lastK = null;
    save();
    showQ();
  } else {
    finish();
  }
}

function finish(){
  const i = view.stage;
  const correct = view.correct, hints = view.hints, score = view.score, n = view.n;
  const pass = correct>=PASS;
  const stars = pass ? (correct===n && hints===0 ? 3 : 2) : 0;
  const prev = state.stars[i];
  const bonus = stars>prev ? stars*10 : 0;
  state.points += score + bonus;
  state.stars[i] = Math.max(prev, stars);
  if(pass && i===state.unlocked && i<9) state.unlocked = i+1;
  view = {stage:null};
  save();
  renderHeader();

  const finalStage = i===9 && pass;
  const nextBtn = (pass && i<9)
    ? `<button class="primary" id="again">Siguiente etapa →</button>`
    : `<button class="primary" id="again">${finalStage ? "Volver al mapa" : "Reintentar"}</button>`;
  app.innerHTML = `<section class="result">
    <div class="big">${pass ? "🎉" : "💪"}</div>
    <h2>${finalStage ? "¡Completaste todas las etapas!" : pass ? "¡Etapa superada!" : "Casi lo logras"}</h2>
    <p>Aciertos: ${correct}/${n} · Pistas usadas: ${hints}</p>
    <p>Puntos ganados: ${score}${bonus ? ` + recompensa de ${bonus}` : ""}</p>
    <p class="stars">${stars ? "★".repeat(stars)+"☆".repeat(3-stars) : `Necesitas ${PASS} aciertos para avanzar`}</p>
    <p class="muted">${stars===3 ? "¡Perfecto sin pistas! Ganaste la insignia 💎." : pass ? "Insignia 🏅 desbloqueada." : ""}</p>
    <div class="actions" style="justify-content:center">
      <button class="ghost" id="map">Mapa</button>
      ${nextBtn}
    </div>
  </section>`;
  $("#map").onclick = showMap;
  $("#again").onclick = ()=>{
    if(pass && i<9) startStage(i+1);
    else if(finalStage) showMap();
    else startStage(i);
  };
}

$("#reset").onclick = ()=>{
  if(confirm("¿Borrar todo tu avance?")){
    state = fresh();
    view = {stage:null};
    save();
    showMap();
  }
};

renderHeader();
showMap();
</script>
</body>
</html>
