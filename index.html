<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Quest B1</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1d2433;--muted:#6b7280;--accent:#4f46e5;--ok:#16a34a;--bad:#dc2626;--gold:#f59e0b;--line:#e5e7eb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1320;--card:#1a2030;--text:#e8ecf5;--muted:#9aa3b5;--accent:#818cf8;--line:#2a3143}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
h2{margin:6px 0 10px}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;max-width:1000px;margin:0 auto}
.stats{display:flex;align-items:center;gap:12px}
.barwrap{height:10px;background:var(--line);border-radius:99px;margin:10px auto;max-width:1000px;overflow:hidden}
#bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .4s}
main{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
.map-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:12px}
.stage{display:flex;flex-direction:column;gap:6px;text-align:left;min-height:96px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);font:inherit;cursor:pointer}
.stage:hover:not(:disabled){border-color:var(--accent)}
.stage.locked{opacity:.5;cursor:not-allowed}
.stage .num{font-weight:700;color:var(--accent)}
.stage .st{color:var(--gold);letter-spacing:2px}
.quiz{max-width:720px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.tag{display:inline-block;font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--line);color:var(--muted)}
.q{font-size:1.3rem;font-weight:600;margin:10px 0 0}
.opts{display:grid;gap:10px;grid-template-columns:1fr;margin-top:14px}
@media (min-width:640px){.opts{grid-template-columns:1fr 1fr}}
.opt{min-height:52px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:1.05rem;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:rgba(22,163,74,.15)}
.opt.wrong{border-color:var(--bad);background:rgba(220,38,38,.15)}
.fb{min-height:48px;margin-top:14px}
.ok{color:var(--ok);font-weight:600}
.bad{color:var(--bad);font-weight:600}
.hint{color:var(--muted);font-style:italic}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.bar2{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 16px}
.bar2 i{display:block;height:100%;background:var(--accent);transition:width .3s}
.primary{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 18px;min-height:44px;font:inherit;cursor:pointer}
.ghost{background:transparent;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:44px;font:inherit;cursor:pointer}
.ghost:disabled{opacity:.4;cursor:not-allowed}
.sm{min-height:36px;padding:6px 10px}
.muted{color:var(--muted);font-size:.9rem}
.result{text-align:center;max-width:520px;margin:30px auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px}
.big{font-size:3rem}
.stars{font-size:1.6rem;color:var(--gold)}
.badge{font-size:1.3rem}
.msg{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;font-size:1.4rem;font-weight:700;font-style:normal;line-height:1.4;color:#0C447C;background:#E6F1FB;border:1px solid #85B7EB;border-radius:16px;padding:14px 18px;margin:16px auto;max-width:460px;text-align:center}
.tipbox{background:#FAEEDA;border:1px solid #EF9F27;border-radius:12px;padding:10px 14px;margin:10px 0;color:#633806}
.tipbox ul{margin:6px 0 0;padding-left:20px}
.texts{font-size:.95rem;line-height:1.5;margin:12px 0}
.texts p{margin:6px 0}
.texts b{display:inline-block;min-width:14px;margin-right:14px}
.row2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0}
.row2 select{min-height:36px;border-radius:8px;padding:4px 8px}
.small{font-size:1rem}
.gap{min-height:34px;border-radius:8px;padding:2px 6px;margin:0 4px;font:inherit}
.sents{list-style:none;padding:0;margin:8px 0;font-size:.95rem;line-height:1.5}
.sents li{margin:6px 0}
.sents b{display:inline-block;min-width:16px;margin-right:12px}
.cf{position:fixed;top:-40px;font-size:24px;animation:fall 3s linear forwards;pointer-events:none;z-index:50}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.medal{font-size:4rem;animation:pop .6s ease-out}
.medal-wrap{display:flex;align-items:center;justify-content:center;gap:6px;margin:4px 0}
.laurel{width:64px;height:160px;flex:0 0 auto}
.laurel.r{transform:scaleX(-1)}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
.star{font-weight:700;color:var(--gold);font-size:1.2rem}
.score{font-size:1.1rem}
.result.final{max-width:960px;padding:24px 28px}
.msg.wide{max-width:900px;font-size:1.15rem;line-height:1.5;padding:16px 22px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 16px}
.panel h3{margin:0 0 6px}
.skills{margin:6px 0 10px;padding-left:18px}
.scale{margin-left:8px;white-space:nowrap}
.scale .face{display:inline-block;opacity:.3;font-size:1.1rem;margin:0 1px;transition:transform .2s}
.scale .face.on{opacity:1;transform:scale(1.4)}
.passage{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0 0;font-size:1.02rem;line-height:1.6}
</style>
</head>
<body>
<header>
  <div class="row">
    <strong>🎓 English Quest B1</strong>
    <div class="stats">
      <span>⭐ <b id="pts">0</b> pts</span>
      <button id="lang" class="ghost sm">🌐 Español</button>
      
      <button id="reset" class="ghost sm">Reiniciar</button>
    </div>
  </div>
  <div class="barwrap"><div id="bar"></div></div>
  <div class="row muted"><span id="prog"></span><span id="badges"></span></div>
</header>
<main id="app"></main>

<script>

{t:"Present Simple",q:[

const keyOf = q => q.lt ? "G:" + q.g : q.q + "|" + [...q.o].sort().join(",");

function pickFinal(i){
  const hk = i===18 ? "usedFinal2" : "usedFinal";
  const pool = STAGES[i].q;
  const used = new Set(state[hk] || []);
  const free = k => !used.has(keyOf(pool[k]));
  const idx = pred => pool.map((x,k)=>pred(x)?k:-1).filter(k=>k>=0);
  let rd = idx(x=>x.rd && !x.lt).filter(free);
  let gr = idx(x=>!x.rd).filter(free);
  let groups = [...new Set(idx(x=>x.lt).map(k=>pool[k].g))];
  let freeG = groups.filter(g=>!used.has("G:"+g));
  if(rd.length<2 || gr.length<10 || freeG.length<2){
    // Se agotaron preguntas no usadas: se reinicia el historial del examen
    state[hk] = [];
    rd = idx(x=>x.rd && !x.lt);
    gr = idx(x=>!x.rd);
    freeG = groups;
  }
  const pickG = randomSubset(freeG.length,2).map(k=>freeG[k]);
  const c = idx(x=>x.lt && pickG.includes(x.g));
  const b = randomSubset(gr.length,10).map(k=>gr[k]);
  const a = randomSubset(rd.length,2).map(k=>rd[k]);
  return [...b, ...a, ...c];
}

function pct(a){ return a[1] ? Math.round(a[0]/a[1]*100)+"% ("+a[0]+"/"+a[1]+")" : "sin datos"; }

function moodScale(){
  const ok = state.skills.gram[0] + state.skills.read[0];
  const t = state.skills.gram[1] + state.skills.read[1];
  const p = t ? ok/t : -1;
  const k = p<0 ? -1 : p<0.2 ? 0 : p<0.4 ? 1 : p<0.6 ? 2 : p<0.8 ? 3 : 4;
  const faces = ["😢","😕","😐","🙂","😄"];
  return `<span class="scale">${faces.map((f,i)=>`<span class="face${i===k?" on":""}">${f}</span>`).join("")}</span>`;
}

      <li>Comprensión lectora: <b>${pct(s.read)}</b></li>
    </ul>
  </section>`;
}

function finishFinal(i){
  const n = view.n, c = view.correct, r = view.rd, score = view.score;
  const overall = c/n, readOk = r[1] ? r[0]/r[1] : 0;
  const b1 = overall>=0.75 && readOk>=0.75;
  const bonus = b1 ? 50 : 0;
  const rk = i===18 ? "finalResult2" : "finalResult";
  state[rk] = {score:c, n:n, read:[r[0],r[1]], b1:b1, date:Date.now()};
  if(b1 && i===state.unlocked) state.unlocked = i+1;
  const hk2 = i===18 ? "usedFinal2" : "usedFinal";
  state[hk2] = [...(state[hk2] || []), ...view.qs.map(k=>keyOf(STAGES[i].q[k]))];
  state.points += score + bonus;
  view = {stage:null};
  save();
  renderHeader();
  app.innerHTML = `<section class="result">
    <div class="big">${b1 ? "🏆" : "📘"} ${faceFor(c, n)}</div>
    <h2>${b1 ? "¡Nivel B1 estimado!" : "Todavía no alcanzas B1"}</h2>
    <p>Aciertos: ${c}/${n} · Lectura: ${r[0]}/${r[1]}</p>
    <p class="msg">${pickMsg(c/n)}</p>
    <p>Puntos: ${score}${bonus ? ` + recompensa de ${bonus}` : ""}</p>
    <p class="muted">${b1 ? "Superaste 75% en general y 75% en lectura." : "Necesitas al menos 75% en general y 75% en lectura. Repasa las etapas donde fallaste más."}</p>
    <p class="muted">Esta estimación cubre gramática y lectura. La comprensión auditiva, la escritura y la expresión oral aún no se miden.</p>
    <div class="actions" style="justify-content:center"><button class="ghost" id="map">Mapa</button><button class="primary" id="retry">Repetir examen</button></div>
  </section>`;
  $("#map").onclick = showMap;
  $("#retry").onclick = ()=>startStage(i);
}

function startFinal(){ startStage(12); }

function pickRun(i){
  if(i===12||i===18) return pickFinal(i);
  const pool = STAGES[i].q;
  const rds = pool.map((x,k)=>x.rd?k:-1).filter(k=>k>=0);
  const prev = (state.lastRd||{})[i];
  let cand = rds.filter(k=>k!==prev);
  if(!cand.length) cand = rds;
  const rdI = cand[Math.floor(Math.random()*cand.length)];
  state.lastRd = {...(state.lastRd||{}), [i]: rdI};
  const others = pool.map((_,k)=>k).filter(k=>!pool[k].rd);
  const pick = randomSubset(others.length, N-1).map(k=>others[k]);
  return [...pick, rdI];
}

const KEY = "englishQuestB1_v1";

function fresh(){ return {unlocked:0, stars:Array(20).fill(0), points:0, session:null, skills:{gram:[0,0],read:[0,0]}, finalResult:null}; }
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && Array.isArray(s.stars) && s.stars.length>=10){
      if(!s.v){ s.stars = [...s.stars.slice(0,9),0,0,...s.stars.slice(9)]; if(s.unlocked>9) s.unlocked += 2; s.session = null; s.v = 2; }
      if(s.session && (!s.session.qs || !s.session.n)) s.session = null; // formato anterior
      if(!s.skills) s.skills = {gram:[0,0],read:[0,0]};
      while(s.stars.length<20) s.stars.push(0);
      if(s.finalResult === undefined) s.finalResult = null;
      if(s.stars[11]>0 && s.unlocked<12) s.unlocked = 12; // examen 1 desbloqueado
      return s;
    }
  }catch(e){}
  return fresh();
}
function save(){
  state.session = (view.stage!==null && view.stage!==undefined && !view.act && !view.cloze) ? view : null;
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
}
function pickQuestions(n){
  const idx = STAGES[0].q.map((_,i)=>i);
  return idx; // se reemplaza por etapa en startStage
}
function randomSubset(total, n){
  const a = [...Array(total).keys()];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a.slice(0,n);
}

function showHint(){

function hint(){
  if(view.answered || view.hinted.includes(view.qi)) return;
  view.hinted.push(view.qi);
  view.hints++;
  view.score = Math.max(0, view.score-3);
  showHint();
  $("#hint").disabled = true;
  save();
}

function answer(k){
  if(view.answered) return;
  view.answered = true;
  view.lastK = k;
  const isRd = !!curQ().rd, ok = k===curQ().a, sk = isRd ? "read" : "gram";
  if(!state.skills) state.skills = {gram:[0,0],read:[0,0]};
  state.skills[sk][1]++; if(ok) state.skills[sk][0]++;
  view.rd = view.rd || [0,0];
  if(isRd){ view.rd[1]++; if(ok) view.rd[0]++; }
  if(ok){ view.correct++; view.score += 10; }
  reveal();
  save();
}

function reveal(){
  const q = curQ(), k = view.lastK, ok = k===q.a;
  app.querySelectorAll(".opt").forEach((b,j)=>{
    b.disabled = true;
    if(j===q.a) b.classList.add("right");
    else if(j===k) b.classList.add("wrong");
  });
  $("#fb").innerHTML = `<p class="${ok?"ok":"bad"}">${ok ? "¡Correcto! +10 pts" : "Incorrecto. La respuesta es “"+q.o[q.a]+"”."}</p>`;
  $("#hint").disabled = true;
  const nx = $("#next");
  nx.hidden = false;
  nx.textContent = view.qi<view.n-1 ? "Siguiente →" : "Ver resultado";
  $("#sc").textContent = view.score+" pts";
}

function next(){
  if(view.qi<view.n-1){
    view.qi++;
    view.answered = false;
    view.lastK = null;
    save();
    showQ();
  } else {
    finish();
  }
}

function pickMsg(p){
  const pct = p*100;
  const lvl = pct<=30 ? 0 : pct<=45 ? 1 : pct<=60 ? 2 : pct<=80 ? 3 : pct<100 ? 4 : 5;
  const pool = MSG_POOL[lvl];
  state.msgUsed = state.msgUsed || {};
  let used = state.msgUsed[lvl] || [];
  let avail = pool.map((_,k)=>k).filter(k=>!used.includes(k));
  if(!avail.length){ used = []; avail = pool.map((_,k)=>k); }
  const k = avail[Math.floor(Math.random()*avail.length)];
  state.msgUsed[lvl] = [...used, k];
  return pool[k];
}

function faceFor(c, n){
  const p = n ? c/n : 0;
  const faces = ["😢","😕","😐","🙂","😄"];
  return faces[p<0.2 ? 0 : p<0.4 ? 1 : p<0.6 ? 2 : p<0.8 ? 3 : 4];
}

function finish(){
  if(view.stage===12||view.stage===18) return finishFinal(view.stage);
  const i = view.stage;
  const correct = view.correct, hints = view.hints, score = view.score, n = view.n;
  const pass = correct>=PASS;
  const stars = pass ? (correct===n && hints===0 ? 3 : 2) : 0;
  const prev = state.stars[i];
  const bonus = stars>prev ? stars*10 : 0;
  state.points += score + bonus;
  state.stars[i] = Math.max(prev, stars);
  if(pass && i===state.unlocked && i<18) state.unlocked = i+1;
  view = {stage:null};
  save();
  renderHeader();

  const finalStage = i===9 && pass;
  const nextBtn = (pass && i<9)
    ? `<button class="primary" id="again">Siguiente etapa →</button>`
    : `<button class="primary" id="again">${finalStage ? "Ir al examen final" : "Reintentar"}</button>`;
  app.innerHTML = `<section class="result">
    <div class="big">${pass ? "🎉" : "💪"} ${faceFor(correct, N)}</div>
    <h2>${finalStage ? "¡Examen final desbloqueado!" : pass ? "¡Etapa superada!" : "Casi lo logras"}</h2>
    <p>Aciertos: ${correct}/${n} · Pistas usadas: ${hints}</p>
    <p>Puntos ganados: ${score}${bonus ? ` + recompensa de ${bonus}` : ""}</p>
    <p class="msg">${pickMsg(correct/n)}</p>
    <p class="stars">${stars ? "★".repeat(stars)+"☆".repeat(3-stars) : `Necesitas ${PASS} aciertos para avanzar`}</p>
    <p class="muted">${stars===3 ? "¡Perfecto sin pistas! Ganaste la insignia 💎." : pass ? "Insignia 🏅 desbloqueada." : ""}</p>
    <div class="actions" style="justify-content:center">
      <button class="ghost" id="map">Mapa</button>
      ${nextBtn}
    </div>
  </section>`;
  $("#map").onclick = showMap;
  $("#again").onclick = ()=>{
    if(pass && i<9) startStage(i+1);
    else if(finalStage) startFinal();
    else startStage(i);
  };
}


$("#reset").onclick = ()=>{
  if(confirm("¿Borrar todo tu avance?")){
    state = fresh();
    view = {stage:null};
    save();
    showMap();
  }
};

// IDIOMA DE LA INTERFAZ (español / inglés). Las preguntas, textos y pistas no cambian.
const EN = {
"Reiniciar":"Reset", "Mapa de etapas":"Stage map", "Cada intento tiene ":"Each attempt has ",
"preguntas: una lectura obligatoria y el resto al azar":"questions: one mandatory reading and the rest at random",
"Continuar etapa":"Continue stage", "Bloqueada":"Locked", "Disponible":"Available",
"Sin insignias todavía":"No badges yet", "etapas completadas":"stages completed",
"Tu nivel por habilidad":"Your level by skill", "Gramática:":"Grammar:", "Comprensión lectora:":"Reading comprehension:",
"← Mapa":"← Map", "Mapa":"Map", "Etapa ":"Stage ", "Examen ":"Exam ", "mixto":"mixed",
"Pregunta ":"Question ", "Pregunta":"Question", "Pista (−3 pts)":"Hint (−3 pts)",
"Siguiente →":"Next →", "Siguiente etapa →":"Next stage →", "Ver resultado":"See result",
"¡Correcto! +10 pts":"Correct! +10 pts", "Incorrecto. La respuesta es ":"Incorrect. The answer is ",
"Afirmativa":"Affirmative", "Negativa":"Negative", "Comprensión de lectura":"Reading comprehension",
"¡Examen final desbloqueado!":"Final exam unlocked!", "¡Etapa superada!":"Stage passed!", "Casi lo logras":"Almost there",
"Aciertos:":"Correct:", "Pistas usadas:":"Hints used:", "Puntos ganados:":"Points earned:", "recompensa de":"bonus of",
"Necesitas ":"You need ", "aciertos para avanzar":"correct answers to advance",
"¡Perfecto sin pistas! Ganaste la insignia 💎.":"Perfect without hints! You earned the 💎 badge.",
"Insignia 🏅 desbloqueada.":"🏅 badge unlocked.", "Ir al examen final":"Go to the final exam", "Reintentar":"Try again",
"¡Nivel B1 estimado!":"Estimated B1 level!", "Todavía no alcanzas B1":"You don’t reach B1 yet", "Lectura:":"Reading:", "Puntos:":"Points:",
"Superaste 75% en general y 75% en lectura.":"You passed 75% overall and 75% in reading.",
"Necesitas al menos 75% en general y 75% en lectura. Repasa las etapas donde fallaste más.":"You need at least 75% overall and 75% in reading. Review the stages where you missed the most.",
"Esta estimación cubre gramática y lectura. La comprensión auditiva, la escritura y la expresión oral aún no se miden.":"This estimate covers grammar and reading. Listening, writing and speaking are not measured yet.",
"Repetir examen":"Repeat exam"
};
const ES_KEYS = Object.keys(EN).sort((a,b)=>b.length-a.length);
function toEN(s){ for(const k of ES_KEYS) s = s.split(k).join(EN[k]); return s; }
function trNode(n){
  if(n.nodeType===3){
    if(n.__es===undefined) n.__es = n.nodeValue;
    const v = state.lang==="en" ? toEN(n.__es) : n.__es;
    if(n.nodeValue!==v) n.nodeValue = v;
    return;
  }
  if(n.childNodes) n.childNodes.forEach(trNode);
}
function applyLang(){
  $("#lang").textContent = state.lang==="en" ? "🌐 English" : "🌐 Español";
  trNode(document.body);
}
$("#lang").onclick = ()=>{ state.lang = state.lang==="en" ? "es" : "en"; save(); applyLang(); };
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(trNode))).observe(document.body,{childList:true,subtree:true});
renderHeader();
showMap();
applyLang();
</script>
